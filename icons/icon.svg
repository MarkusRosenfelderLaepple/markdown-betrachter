<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Quelle für alle App-Icons (deno task icons -> icon.png/.ico/.icns).
       Nur rect, path und ein linearer Gradient: keine Filter, keine Fonts, keine
       Haarlinien. Das Icon wird bis auf 16 px gerechnet, dort überlebt nur, was
       groß und deckend ist — deshalb füllt die Markdown-Marke (blockiges „M"
       plus Pfeil nach unten) fast die ganze Fläche und ist als Pfad gezeichnet,
       nicht gesetzt. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1a7fd4" />
      <stop offset="0.55" stop-color="#0a5fae" />
      <stop offset="1" stop-color="#00376d" />
    </linearGradient>
  </defs>

  <!-- Squircle-nahe Grundform mit eigener Rundung und ~6 % Luft außen:
       macOS beschneidet nichts und rundet nichts nach. -->
  <rect x="64" y="64" width="896" height="896" rx="200" ry="200" fill="url(#bg)" />
  <!-- Kante nach innen: gibt dem Icon auf hellem Grund eine Abgrenzung, ohne
       dass ein Schlagschatten (= Filter) nötig wäre. -->
  <rect x="64" y="64" width="896" height="896" rx="200" ry="200" fill="none"
    stroke="#ffffff" stroke-opacity="0.16" stroke-width="10" />

  <!-- Rahmen der Markdown-Marke. Bewusst schwach: bei 16 px verschwindet er
       und stört die Lesbarkeit der beiden Hauptformen nicht. -->
  <rect x="136" y="276" width="752" height="472" rx="76" ry="76" fill="none"
    stroke="#ffffff" stroke-opacity="0.26" stroke-width="18" />

  <!-- „M" aus zwei Spitzen. -->
  <path d="M210 662 V362 h72 l88 108 l88 -108 h72 v300 h-72 V470 l-88 106 l-88 -106 v192 z"
    fill="#ffffff" />
  <!-- Pfeil nach unten, im Akzentton — das einzige farbige Element und damit
       die Form, an der man die App in der Leiste erkennt. -->
  <path d="M652 362 h90 v138 h72 l-117 162 l-117 -162 h72 z" fill="#f46610" />
</svg>
